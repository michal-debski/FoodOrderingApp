<form [formGroup]="addIngredientForm" (ngSubmit)="confirmAddIngredient()" novalidate>
  <div class="form-group">
    <label for="name">Ingredient Name</label>
    <input id="name" type="text" formControlName="name" placeholder="e.g. Mozzarella" />
    <div class="error-message" *ngIf="addIngredientForm.get('name')?.invalid && addIngredientForm.get('name')?.touched">
      Name is required.
    </div>
  </div>

  <div class="form-group">
    <label for="quantity">Quantity</label>
    <input
      id="quantity"
      class="quantity-input"
      type="number"
      formControlName="quantity"
      min="1"
      step="1"
      placeholder="0"
    />
    <div class="error-message" *ngIf="addIngredientForm.get('quantity')?.invalid && addIngredientForm.get('quantity')?.touched">
      Quantity is required.
    </div>
  </div>

  <div class="form-group">
    <label for="unit">Unit</label>
    <div class="select-wrapper">
      <select id="unit" formControlName="unit">
        <option value="" selected disabled>Select unit</option>
        @for (unit of units; track unit) {
        <option [value]="unit">{{ unit }}</option>
        }
      </select>
    </div>
  </div>

  <button type="submit" [disabled]="addIngredientForm.invalid" class="btn-black submit-btn">
    Add Ingredient
  </button>
</form>
