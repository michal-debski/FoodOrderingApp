<form [formGroup]="addIngredientForm" (ngSubmit)="confirmAddIngredient()" novalidate >
  <div class="form-group">
    <label for="name">Ingredient Name:</label>
    <input id="name" type="text" formControlName="name" />
    <div class="error" *ngIf="addIngredientForm.get('name')?.invalid && addIngredientForm.get('name')?.touched">
      Name is required.
    </div>
  </div>

  <div class="form-group">
    <label for="quantity">Quantity:</label>
    <input
          class="quantity"
          type="number"
          formControlName="quantity"
          min="1"
          step="1"
          placeholder="Quantity"
        />
    <div class="error" *ngIf="addIngredientForm.get('quantity')?.invalid && addIngredientForm.get('quantity')?.touched">
      Quantity is required.
    </div>
  </div>

  <div class="form-group">
    <label for="unit">Unit:</label>
    <select id="unit" formControlName="unit">
      <option value="" selected>Select unit</option>
      @for (unit of units; track unit) {
      <option [ngValue]="unit">{{ unit }}</option>
      }
    </select>
  </div>

  <button type="submit" [disabled]="addIngredientForm.invalid">Add Ingredient</button>
</form>
