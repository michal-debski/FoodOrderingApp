server:
  port: 8222
auth:
  service:
    url: http://auth-service:8220
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost
              - http://localhost:4200
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-User-Email
            exposedHeaders:
              - Authorization
              - X-User-Email
            allowCredentials: true
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api/v1/auth/(?<segment>.*), /auth/${segment}
            - id: meal-service
              uri: lb://MEAL-SERVICE
              predicates:
                - Path=/api/v1/meals/**
              filters:
                - RewritePath=/api/v1/meals/(?<segment>.*), /meals/${segment}
                - JwtValidation
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - RewritePath=/api/v1/orders/(?<segment>.*), /orders/${segment}
                - JwtValidation
            - id: restaurant-service
              uri: lb://RESTAURANT-SERVICE
              predicates:
                - Path=/api/v1/restaurants/**
              filters:
                - RewritePath=/api/v1/restaurants(?<segment>/.*|), /restaurants${segment}
                - JwtValidation
            - id: shopping-cart-service
              uri: lb://SHOPPING-CART-SERVICE
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - RewritePath=/api/v1/cart(?<segment>/.*|), /cart${segment}
                - JwtValidation
