spring:
    config:
      import: optional:configserver:http://config-service:8888
    application:
      name: discovery-service
eureka:
  instance:
    hostname: discovery-service
  client:
    registerWithEureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}
server:
  port: 8761